# Configuração do Firebase App Hosting para Next.js
# https://firebase.google.com/docs/app-hosting

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: production
  - variable: AUTH_STORE
    value: sqlite
  # Para conectar com Firestore, altere AUTH_STORE para 'firebase'
  # e adicione FIREBASE_PROJECT_ID e FIREBASE_SERVICE_ACCOUNT_JSON nas variáveis/secrets

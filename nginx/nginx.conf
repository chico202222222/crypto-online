# ==============================================================================
# Nginx Load Balancer Configuration for Crypto Online
# Strategy: IP Hash (ip_hash) for session persistence across client IPs
# Entrypoint: http://localhost:3000
#
# Upstream Clusters:
#  - Next.js Frontend Cluster : 127.0.0.1:3001, 127.0.0.1:3002
#  - Rust Microservice    : 127.0.0.1:18080, 127.0.0.1:18081
# ==============================================================================

worker_processes auto;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories localized to workspace
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # High performance buffer & timeout settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Custom log format with upstream telemetry
    log_format load_balancer_format '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent" '
                                    'upstream: $upstream_addr status: $upstream_status '
                                    'rt: ${request_time}s urt: ${upstream_response_time}s';

    access_log logs/access.log load_balancer_format;

    # Map for WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================================================
    # UPSTREAM CLUSTERS (IP HASH)
    # ==========================================================================

    # Cluster 1: Next.js Frontend Instances
    upstream nextjs_cluster {
        ip_hash;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Cluster 2: Rust High-Performance API Instances
    upstream rust_api_cluster {
        ip_hash;
        server 127.0.0.1:18080 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:18081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # MAIN LOAD BALANCER SERVER (PORT 3000)
    # ==========================================================================
    server {
        listen 3000;
        server_name localhost 127.0.0.1;

        # Custom header telemetry for inspection
        add_header X-Served-By-Load-Balancer "nginx-ip-hash" always;
        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Upstream-Response-Time $upstream_response_time always;

        # ----------------------------------------------------------------------
        # Load Balancer Status & Diagnostics
        # ----------------------------------------------------------------------
        location /lb-status {
            default_type application/json;
            return 200 '{"status":"online","balancer":"nginx","algorithm":"ip_hash","listen_port":3000,"upstreams":{"nextjs_cluster":["127.0.0.1:3001","127.0.0.1:3002"],"rust_api_cluster":["127.0.0.1:18080","127.0.0.1:18081"]}}\n';
        }

        # ----------------------------------------------------------------------
        # Rust Microservice Routes
        # ----------------------------------------------------------------------
        # Plotters Price Chart generator
        location = /api/plot {
            proxy_pass http://rust_api_cluster/api/plot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Rust Candlestick & Ticker Value endpoint
        location = /api/value {
            proxy_pass http://rust_api_cluster/api/value;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # Rust Binance Proxy endpoint
        location = /api/btc {
            proxy_pass http://rust_api_cluster/api/btc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # Rust Healthcheck endpoint
        location = /health/rust {
            proxy_pass http://rust_api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rust Microservices Prefixes (/rust/* and /api/rust/*)
        location /rust/ {
            proxy_pass http://rust_api_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rust/ {
            proxy_pass http://rust_api_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Next.js WebSockets (Fast Refresh / HMR)
        # ----------------------------------------------------------------------
        location /_next/webpack-hmr {
            proxy_pass http://nextjs_cluster/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # ----------------------------------------------------------------------
        # Next.js Static Assets
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_cluster/_next/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # Next.js Default Frontend & App Router API (/api?coin=...)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
